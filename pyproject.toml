[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens-ai"
version = "0.1.0"
description = "Source-cited AI engineering knowledge assistant"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "openai>=1.0,<3",
]

[project.optional-dependencies]
rag = ["langchain-text-splitters>=0.3,<2", "faiss-cpu>=1.8,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
devlens = "devlens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
